<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEDI-PASS | Patient Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="register-page">

        <div class="register-container">

            <div class="register-header">

                <div class="register-icon">🏥</div>

                <h1>Create Your MEDI-PASS Profile</h1>

                <p>
                    Securely organize your medical information in one place.
                </p>

            </div>


            <form onsubmit="registerPatient(event)">

                <!-- PERSONAL INFORMATION -->
                <div class="form-section">

                    <h2>👤 Personal Information</h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Full Name *</label>
                            <input
                                type="text"
                                id="name"
                                placeholder="Enter full name"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input
                                type="date"
                                id="dob"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Gender *</label>

                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Mobile Number *</label>

                            <input
                                type="tel"
                                id="mobile"
                                placeholder="Enter mobile number"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter email">
                        </div>

                        <div class="form-group">
                            <label>Blood Group *</label>

                            <select id="blood" required>
                                <option value="">Select Blood Group</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Height (cm)</label>

                            <input
                                type="number"
                                id="height"
                                placeholder="e.g. 170">
                        </div>

                        <div class="form-group">
                            <label>Weight (kg)</label>

                            <input
                                type="number"
                                id="weight"
                                placeholder="e.g. 65">
                        </div>

                    </div>

                </div>


                <!-- EMERGENCY CONTACT -->
                <div class="form-section">

                    <h2>🚨 Emergency Contact</h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Contact Name *</label>

                            <input
                                type="text"
                                id="emergencyName"
                                placeholder="Emergency contact name"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Contact Phone *</label>

                            <input
                                type="tel"
                                id="emergencyPhone"
                                placeholder="Emergency contact number"
                                required>
                        </div>

                    </div>

                </div>


                <!-- MEDICAL INFORMATION -->
                <div class="form-section">

                    <h2>🩺 Medical Information</h2>

                    <div class="form-grid">

                        <div class="form-group full">

                            <label>Existing Conditions</label>

                            <textarea
                                id="conditions"
                                placeholder="Example: Diabetes, Asthma, Blood Pressure..."></textarea>

                        </div>


                        <div class="form-group full">

                            <label>Allergies</label>

                            <textarea
                                id="allergies"
                                placeholder="Example: Drug allergy, food allergy..."></textarea>

                        </div>

                    </div>

                </div>


                <!-- ABHA & LANGUAGE -->
                <div class="form-section">

                    <h2>📋 Additional Information</h2>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>ABHA ID</label>

                            <input
                                type="text"
                                id="abha"
                                placeholder="Optional">
                        </div>


                        <div class="form-group">

                            <label>Preferred Language</label>

                            <select id="language">

                                <option>English</option>
                                <option>Hindi</option>
                                <option>Marathi</option>

                            </select>

                        </div>

                    </div>

                </div>


                <div class="note">

                    🔐 Your medical information should only be shared
                    with authorized people when required.

                </div>


                <button
                    type="submit"
                    class="register-button">

                    Create MEDI-PASS Profile

                </button>


                <a
                    href="index.html"
                    class="back-button">

                    ← Back to Home

                </a>

            </form>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
